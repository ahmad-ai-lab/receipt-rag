[project]
name = "receipt-rag"
version = "0.1.0"
description = "Extract structured data from receipts, then search and answer with citations."
authors = [
    { name = "ahmad akel", email = "ahmad.oudai1999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real model provider (opt-in: pytest -m live)",
]
